<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TBD Explorer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%94%96%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --page: #f9f9f7;
        --surface: #fcfcfb;
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --muted: #898781;
        --grid: #e1e0d9;
        --baseline: #c3c2b7;
        --border: rgba(11, 11, 11, 0.1);
        --accent: #2a78d6;
        --accent-strong: #1c5cab;
        --scrim: rgba(12, 12, 10, 0.72);
        --badge-bg: rgba(12, 12, 10, 0.6);
        --badge-ink: #ffffff;
        --lightbox: rgba(18, 18, 16, 0.82);
        --danger: #b3372f;
        --ok: #2e7d32;
        --warnc: #b45309;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --page: #0d0d0d;
          --surface: #1a1a19;
          --ink: #ffffff;
          --ink-2: #c3c2b7;
          --muted: #898781;
          --grid: #2c2c2a;
          --baseline: #383835;
          --border: rgba(255, 255, 255, 0.1);
          --accent: #3987e5;
          --accent-strong: #6da7ec;
          --scrim: rgba(8, 8, 7, 0.78);
          --badge-bg: rgba(8, 8, 7, 0.62);
          --badge-ink: #ffffff;
          --lightbox: rgba(5, 5, 4, 0.86);
          --danger: #e06055;
          --ok: #6abf73;
          --warnc: #f0a24a;
        }
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 20px 72px;
      }

      /* ---- Header: identity + one quiet stats line ---- */
      header.page {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      header.page h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 0;
      }
      header.page h1 button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      header.page h1 button:hover {
        color: var(--accent);
      }
      header.page h1 button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .statline {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .statline .stat {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        font: inherit;
        color: var(--ink-2);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 12px;
      }
      .statline .stat b {
        color: var(--ink);
        font-weight: 600;
      }
      .statline button.stat {
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          color 0.15s ease;
      }
      .statline button.stat:hover {
        color: var(--ink);
        border-color: var(--muted);
      }
      .statline button.stat:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .statline .stat.live::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
      }

      /* ---- Subpages (authors / media / timeline) ---- */
      .sphead {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 14px 0 14px;
      }
      .spback {
        font: inherit;
        font-size: 13px;
        color: var(--ink-2);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 14px;
        cursor: pointer;
      }
      .spback:hover {
        color: var(--ink);
        border-color: var(--muted);
      }
      .sptitle {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      .spsummary {
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 10px;
        font-variant-numeric: tabular-nums;
      }
      .spbody {
        display: flex;
        flex-direction: column;
        max-width: 720px;
      }
      .srow {
        display: grid;
        align-items: center;
        gap: 10px;
        padding: 6px 8px;
        font: inherit;
        color: inherit;
        text-align: left;
        background: none;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .srow:hover {
        background: color-mix(in srgb, var(--accent) 8%, transparent);
      }
      .srow.author {
        grid-template-columns: 20px minmax(140px, 1fr) 2fr 48px;
      }
      .srow.plain {
        grid-template-columns: minmax(90px, 130px) 1fr 48px;
      }
      .srow .swho {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .srow .swho b {
        font-weight: 600;
      }
      .srow .shandle {
        color: var(--muted);
        font-size: 12.5px;
        margin-left: 6px;
      }
      .srow .slabel {
        font-size: 13px;
        color: var(--ink-2);
        white-space: nowrap;
      }
      .srow .strack {
        height: 10px;
        position: relative;
      }
      .srow .sbar {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--accent);
        opacity: 0.7;
        border-radius: 0 3px 3px 0;
        min-width: 2px;
      }
      .srow .scount {
        font-size: 12px;
        font-weight: 600;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .spnote {
        color: var(--muted);
        padding: 12px 0;
      }
      .spbody.wide {
        max-width: 960px;
      }
      .loglist {
        max-height: 70vh;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        padding: 8px 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.6;
      }
      .logrow {
        display: grid;
        grid-template-columns: 66px 14px 1fr;
        gap: 8px;
        padding: 1px 14px;
        align-items: baseline;
      }
      .logrow .ltime {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .logrow .lmark {
        text-align: center;
        font-weight: 700;
      }
      .logrow.info .lmark {
        color: var(--ok);
      }
      .logrow.warn .lmark {
        color: var(--warnc);
      }
      .logrow.error .lmark {
        color: var(--danger);
      }
      .logrow .lmsg {
        color: var(--ink-2);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .logrow.error .lmsg {
        color: var(--danger);
      }

      /* ---- Download progress strip ---- */
      #dlstrip {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 14px;
      }
      .dlhead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        color: var(--ink-2);
        margin-bottom: 8px;
      }
      #dlpct {
        font-weight: 600;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .dltrack {
        height: 6px;
        border-radius: 3px;
        background: var(--grid);
        overflow: hidden;
      }
      .dlbar {
        height: 100%;
        background: var(--accent);
        border-radius: 3px;
        transition: width 0.6s ease;
      }
      #dlfiles {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 8px;
      }
      .dlfile {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 120px 56px;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .dlfile .fname {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .dlfile .ftrack {
        height: 4px;
        border-radius: 2px;
        background: var(--grid);
        overflow: hidden;
      }
      .dlfile .fbar {
        display: block;
        height: 100%;
        background: var(--accent);
        opacity: 0.75;
        transition: width 0.6s ease;
      }
      .dlfile .fpct {
        text-align: right;
      }

      /* ---- Sticky filter bar ---- */
      .bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 10px 0;
        margin-bottom: 6px;
        background: color-mix(in srgb, var(--page) 88%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .search {
        position: relative;
        flex: 1 1 220px;
        max-width: 340px;
      }
      .search svg {
        position: absolute;
        left: 10px;
        top: 50%;
        translate: 0 -50%;
        width: 14px;
        height: 14px;
        stroke: var(--muted);
        fill: none;
        stroke-width: 2;
        pointer-events: none;
      }
      .search input {
        width: 100%;
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 14px 6px 30px;
      }
      .search input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .tabs {
        display: flex;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px;
      }
      .tabs button {
        font: inherit;
        font-size: 13px;
        color: var(--ink-2);
        background: none;
        border: none;
        border-radius: 999px;
        padding: 4px 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tabs button .n {
        font-size: 11px;
        color: var(--muted);
        margin-left: 4px;
        font-variant-numeric: tabular-nums;
      }
      .tabs button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--page);
      }
      .tabs button[aria-pressed="true"] .n {
        color: color-mix(in srgb, var(--page) 70%, transparent);
      }
      .tabs button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .selwrap {
        position: relative;
        margin-left: auto;
      }
      .selwrap select {
        appearance: none;
        -webkit-appearance: none;
        font: inherit;
        font-size: 13px;
        color: var(--ink-2);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 5px 28px 5px 12px;
        cursor: pointer;
      }
      .selwrap select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .selwrap::after {
        content: "";
        position: absolute;
        right: 13px;
        top: 50%;
        width: 6px;
        height: 6px;
        translate: 0 -70%;
        rotate: 45deg;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        pointer-events: none;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
        border-radius: 999px;
        padding: 3px 6px 3px 12px;
        font-size: 13px;
      }
      .chip[hidden] {
        display: none;
      }
      .chip button {
        font: inherit;
        border: none;
        background: none;
        cursor: pointer;
        color: var(--ink-2);
        padding: 0 4px;
        line-height: 1;
      }

      .countbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 10px 2px 12px;
      }
      #count {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .fixall {
        font: inherit;
        font-size: 12px;
        color: var(--danger);
        background: none;
        border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
        border-radius: 999px;
        padding: 3px 12px;
        cursor: pointer;
      }
      .fixall:hover {
        background: color-mix(in srgb, var(--danger) 8%, transparent);
      }
      .fixall.armed {
        color: #fff;
        background: var(--danger);
        border-color: var(--danger);
      }
      .fixall[hidden] {
        display: none;
      }

      /* ---- Masonry media grid ----
         JS-managed columns (new cards go to the shortest column) so
         "Load more" appends without reflowing existing cards. */
      #grid {
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }
      #grid.loading {
        opacity: 0.5;
      }
      #grid .gcol {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #grid .empty {
        flex: 1;
      }

      .mcard {
        position: relative;
        display: block;
        width: 100%;
        padding: 0;
        border: none;
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        background: var(--surface);
        text-align: left;
        font: inherit;
        color: inherit;
        box-shadow: 0 0 0 1px var(--border);
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }
      .mcard:hover,
      .mcard:focus-visible {
        transform: translateY(-2px);
        box-shadow:
          0 0 0 1px var(--border),
          0 10px 28px rgba(0, 0, 0, 0.16);
      }
      .mcard:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .mcard,
        .mcard:hover {
          transition: none;
          transform: none;
        }
      }

      .thumb {
        position: relative;
        width: 100%;
        display: block;
        background: var(--grid);
      }
      .thumb img,
      .thumb video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .thumb.pending {
        aspect-ratio: 4 / 3;
        display: grid;
        place-items: center;
        background:
          repeating-linear-gradient(
            135deg,
            transparent 0 10px,
            color-mix(in srgb, var(--baseline) 24%, transparent) 10px 11px
          ),
          var(--surface);
        color: var(--muted);
        font-size: 12px;
      }

      .badges {
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
        z-index: 2;
        pointer-events: none;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--badge-bg);
        color: var(--badge-ink);
        border-radius: 6px;
        padding: 2px 7px;
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        backdrop-filter: blur(4px);
      }
      .badge.right {
        margin-left: auto;
      }
      .badge svg {
        width: 10px;
        height: 10px;
        fill: currentColor;
      }

      /* hover text reveal over the media */
      .peek {
        position: absolute;
        inset: auto 0 0 0;
        z-index: 2;
        padding: 28px 12px 12px;
        background: linear-gradient(180deg, transparent, var(--scrim));
        opacity: 0;
        translate: 0 6px;
        transition:
          opacity 0.18s ease,
          translate 0.18s ease;
        pointer-events: none;
      }
      /* Clamp lives on an inner, padding-free element — clamping the padded
         box lets clipped lines bleed into the padding area. */
      .peek .ptext {
        color: #fff;
        font-size: 12px;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .mcard:hover .peek,
      .mcard:focus-visible .peek {
        opacity: 1;
        translate: 0 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .peek {
          transition: none;
          translate: 0 0;
        }
      }

      /* caption row below the media */
      .meta {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 10px;
      }
      .avatar {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 700;
        color: #fff;
        flex: none;
      }
      .meta .handle {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta .when {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        flex: none;
      }

      /* text-only bookmarks as quote cards */
      .tcard .quote {
        padding: 18px 16px 6px;
        font-size: 14.5px;
        line-height: 1.55;
        color: var(--ink);
        white-space: pre-wrap;
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 7;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .tcard .quote::before {
        content: "";
        display: block;
        width: 22px;
        height: 3px;
        border-radius: 2px;
        background: var(--accent);
        margin-bottom: 12px;
      }

      .sentinel {
        padding: 26px 0 6px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      .sentinel[hidden] {
        display: none;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 48px 0;
      }

      /* ---- Lightbox ---- */
      #lb {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--lightbox);
        backdrop-filter: blur(8px);
        padding: 20px;
      }
      #lb.open {
        display: flex;
      }
      .lb-panel {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
        width: min(1280px, 100%);
        /* Fixed height so media can size against it and fit unclipped. */
        height: min(940px, 92vh);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }
      @media (max-width: 720px) {
        .lb-panel {
          grid-template-columns: 1fr;
          overflow-y: auto;
        }
      }
      .lb-media {
        min-height: 280px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        overflow-y: auto;
        background: var(--page);
      }
      .lb-media img,
      .lb-media video {
        /* Natural size, capped to the panel so nothing is clipped or upscaled. */
        display: block;
        flex: none;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        margin: auto;
      }
      .lb-media .pending {
        flex: 1;
        align-self: stretch;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 13px;
        min-height: 160px;
      }
      .lb-media .lb-quote {
        margin: auto;
        padding: 32px;
        font-size: 19px;
        line-height: 1.55;
        max-width: 34ch;
        color: var(--ink);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .lb-side {
        padding: 20px 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
      }
      .lb-author {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .lb-author .avatar {
        width: 32px;
        height: 32px;
        font-size: 13px;
      }
      .lb-author .who b {
        display: block;
        font-size: 14px;
        line-height: 1.25;
        cursor: pointer;
      }
      .lb-author .who b:hover {
        color: var(--accent);
      }
      .lb-author .who span {
        font-size: 12.5px;
        color: var(--muted);
        cursor: pointer;
      }
      .lb-author .who span:hover {
        color: var(--accent);
      }
      .lb-text {
        margin: 0;
        font-size: 14.5px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .lb-text a,
      .lb-quote a {
        color: var(--accent);
        text-decoration: none;
      }
      .lb-text a:hover,
      .lb-quote a:hover {
        text-decoration: underline;
      }
      .lb-date {
        align-self: flex-start;
        font-size: 12.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        text-decoration: none;
      }
      .lb-date:hover {
        color: var(--accent);
        text-decoration: underline;
      }
      .lb-date:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .lb-actions {
        margin-top: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding-top: 12px;
        border-top: 1px solid var(--grid);
      }
      .lb-actions a,
      .lb-actions button {
        font: inherit;
        font-size: 13px;
        text-decoration: none;
        color: var(--ink-2);
        background: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .lb-actions a.primary {
        color: #fff;
        background: var(--accent);
        border-color: var(--accent);
      }
      .lb-actions[hidden],
      .lb-actions button[hidden] {
        display: none;
      }
      .lb-actions button.danger {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 40%, transparent);
      }
      .lb-actions button.danger:hover {
        background: color-mix(in srgb, var(--danger) 10%, transparent);
      }
      .lb-actions .iconbtn {
        margin-left: auto;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        color: var(--muted);
      }
      .lb-actions .iconbtn svg {
        width: 15px;
        height: 15px;
      }
      .lb-actions .iconbtn:hover {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 40%, transparent);
        background: color-mix(in srgb, var(--danger) 8%, transparent);
      }
      .lb-confirm {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .lb-confirm .crow {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lb-confirm .crow button {
        flex: 1;
        white-space: nowrap;
      }
      .lb-confirm .chead {
        justify-content: space-between;
      }
      .lb-confirm .chead button {
        flex: none;
      }
      .lb-confirm .cq {
        font-size: 13px;
        color: var(--ink-2);
      }
      .lb-confirm .quiet {
        border-color: transparent;
        color: var(--muted);
      }
      .lb-confirm .quiet:hover {
        color: var(--ink);
      }
      .lb-nav {
        position: absolute;
        top: 50%;
        translate: 0 -50%;
        z-index: 60;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink);
        font-size: 17px;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .lb-nav:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .lb-nav.prev {
        left: 16px;
      }
      .lb-nav.next {
        right: 16px;
      }
      .lb-close {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 60;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink);
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="page">
        <h1>
          <button id="home" title="Show all bookmarks">TBD Explorer</button>
        </h1>
        <div class="statline" id="statline">Your X bookmarks archive</div>
      </header>

      <div id="dlstrip" hidden>
        <div class="dlhead">
          <span id="dltext"></span>
          <span id="dlpct"></span>
        </div>
        <div class="dltrack"><div class="dlbar" id="dlbar"></div></div>
        <div id="dlfiles"></div>
      </div>

      <div class="bar">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <input
            id="q"
            type="search"
            placeholder="Search text, name, or @handle"
            aria-label="Search bookmarks"
          />
        </div>
        <div
          class="tabs"
          role="group"
          aria-label="Filter by media type"
          id="tabs"
        ></div>
        <span class="selwrap">
          <select id="sort" aria-label="Sort order">
            <option value="newest">Recently added</option>
            <option value="oldest">Oldest added</option>
            <option value="tweet-newest">Newest tweets</option>
            <option value="tweet-oldest">Oldest tweets</option>
          </select>
        </span>
      </div>

      <span id="chip" class="chip" hidden>
        <span></span
        ><button title="Clear author filter" aria-label="Clear author filter">
          ×
        </button>
      </span>
      <span id="mchip" class="chip" hidden>
        <span></span
        ><button title="Clear month filter" aria-label="Clear month filter">
          ×
        </button>
      </span>

      <div class="countbar">
        <div id="count"></div>
        <button class="fixall" id="fixall" hidden>Remove all</button>
      </div>
      <div id="grid"></div>
      <div class="sentinel" id="more" hidden aria-hidden="true">
        Loading more…
      </div>
      <section id="subpage" hidden></section>
    </main>

    <div id="lb" role="dialog" aria-modal="true" aria-label="Bookmark detail">
      <button class="lb-close" id="lbclose" aria-label="Close">✕</button>
      <button class="lb-nav prev" id="lbprev" aria-label="Previous">←</button>
      <button class="lb-nav next" id="lbnext" aria-label="Next">→</button>
      <div class="lb-panel">
        <div class="lb-media" id="lbmedia"></div>
        <div class="lb-side">
          <div class="lb-author">
            <span class="avatar" id="lbavatar"></span>
            <span class="who">
              <b id="lbname" title="Filter by this author"></b>
              <span id="lbhandle" title="Filter by this author"></span>
            </span>
          </div>
          <p class="lb-text" id="lbtext"></p>
          <a
            class="lb-date"
            id="lbdate"
            href="#"
            target="_blank"
            rel="noopener"
            title="Open on X"
          ></a>
          <div class="lb-actions" id="lbactions">
            <button id="lbfilter">More from this author</button>
            <button id="lbreveal" hidden>Reveal in Finder</button>
            <button
              class="iconbtn"
              id="lbremove"
              title="Remove bookmark"
              aria-label="Remove bookmark"
            >
              <svg
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path
                  d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.7 9.2a1 1 0 0 0 1 .8h4.6a1 1 0 0 0 1-.8L12 4M6.5 7v4M9.5 7v4"
                ></path>
              </svg>
            </button>
          </div>
          <div class="lb-actions lb-confirm" id="lbconfirm" hidden>
            <div class="crow chead">
              <span class="cq">Remove this bookmark?</span>
              <button class="quiet" id="lbcancel">Cancel</button>
            </div>
            <div class="crow">
              <button id="lbkeep">Just the bookmark</button>
              <button class="danger" id="lbdelfiles">Also delete files</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      "use strict";
      const $ = (sel, root) => (root || document).querySelector(sel);
      const fmt = (n) => Number(n).toLocaleString("en-US");

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      const TYPE_LABELS = {
        photo: "photo",
        video: "video",
        animated_gif: "GIF",
      };
      const KIND_TABS = [
        ["all", "All"],
        ["photo", "Photos"],
        ["video", "Videos"],
        ["gif", "GIFs"],
        ["text", "Text"],
        ["missing", "Missing"],
      ];

      /* ---- State ---- */
      const state = {
        view: "grid", // grid | authors | media | timeline
        q: "",
        type: "all",
        author: "",
        month: "",
        sort: "newest",
        page: 1,
        total: 0,
        counts: null,
        items: [],
      };
      let fetchController = null;
      let statsCache = null;

      async function ensureStats() {
        if (statsCache) return statsCache;
        const res = await fetch("/api/explore/stats");
        if (!res.ok) throw new Error("stats request failed");
        statsCache = await res.json();
        return statsCache;
      }

      /* ---- Header stats: one quiet line, each a door to a subpage ---- */
      async function loadStats() {
        const stats = await ensureStats();
        const line = $("#statline");
        line.textContent = "";
        const add = (value, label, onClick) => {
          const s = el(onClick ? "button" : "span", "stat");
          if (value != null) s.append(el("b", "", value), " ");
          s.append(label);
          if (onClick) s.addEventListener("click", onClick);
          line.append(s);
          return s;
        };
        add(fmt(stats.totals.bookmarks), "bookmarks", goHome);
        // Only show the fraction while downloads are still catching up.
        const downloaded = stats.totals.media_downloaded;
        const mediaTotal = stats.totals.media_total;
        add(
          downloaded < mediaTotal
            ? fmt(downloaded) + " / " + fmt(mediaTotal)
            : fmt(mediaTotal),
          "media files",
          () => setView("media"),
        );
        add(fmt(stats.totals.authors), "authors", () => setView("authors"));
        if (stats.first_bookmark) {
          const opt = { year: "numeric", month: "short" };
          add(
            null,
            new Date(stats.first_bookmark).toLocaleDateString(undefined, opt) +
              " – " +
              new Date(stats.last_bookmark).toLocaleDateString(undefined, opt),
            () => setView("timeline"),
          );
        }
        add(null, "Activity", () => setView("activity")).classList.add("live");
      }

      /* ---- Tabs with live counts ---- */
      function renderTabs() {
        const tabs = $("#tabs");
        tabs.textContent = "";
        for (const [key, label] of KIND_TABS) {
          const b = el("button");
          b.setAttribute("aria-pressed", String(state.type === key));
          b.append(label);
          if (state.counts && state.counts[key] != null)
            b.append(el("span", "n", fmt(state.counts[key])));
          b.addEventListener("click", () => {
            if (state.type === key) return;
            state.type = key;
            resetAndLoad();
          });
          tabs.append(b);
        }
      }

      /* ---- Icons / avatar ---- */
      const svgNS = "http://www.w3.org/2000/svg";
      function icon(kind) {
        const s = document.createElementNS(svgNS, "svg");
        s.setAttribute("viewBox", "0 0 12 12");
        const p = document.createElementNS(svgNS, "path");
        if (kind === "play")
          p.setAttribute("d", "M2.5 1.5 L10.5 6 L2.5 10.5 Z");
        if (kind === "stack")
          p.setAttribute("d", "M1 4 h7 v7 h-7 Z M4 1 h7 v7 h-2 V4 H4 Z");
        s.append(p);
        return s;
      }

      function hueFor(handle) {
        let h = 0;
        for (const c of handle.toLowerCase())
          h = (h * 31 + c.charCodeAt(0)) % 360;
        return h;
      }
      // First grapheme of the name — indexing with [0] splits emoji into a
      // lone surrogate (�). Prefer the first letter/digit so "🔥 Jo" → "J";
      // an all-emoji name shows the emoji itself.
      function avatarChar(str) {
        const graphemes =
          typeof Intl !== "undefined" && Intl.Segmenter
            ? Array.from(new Intl.Segmenter().segment(str), (s) => s.segment)
            : Array.from(str);
        const letter = graphemes.find((g) => /\p{L}|\p{N}/u.test(g));
        return (letter || graphemes[0] || "?").toUpperCase();
      }
      function avatarEl(t) {
        const a = el("span", "avatar");
        const handle = t.screen_name || "?";
        a.style.background = `hsl(${hueFor(handle)} 45% 45%)`;
        a.textContent = avatarChar(t.name || handle);
        return a;
      }

      const fmtDate = (d) =>
        new Date(d).toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      const shortDate = (d) =>
        new Date(d).toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
        });

      /* ---- Media helpers ---- */
      const mediaSrc = (m) => "/media/" + encodeURIComponent(m.file);
      const isMotion = (m) => m.type === "video" || m.type === "animated_gif";

      function badgeEl(t) {
        const wrap = el("div", "badges");
        const kinds = new Set(t.media.map((m) => m.type));
        if (kinds.has("video")) {
          const b = el("span", "badge");
          b.append(icon("play"));
          wrap.append(b);
        } else if (kinds.has("animated_gif")) {
          wrap.append(el("span", "badge", "GIF"));
        }
        if (t.media.length > 1) {
          const b = el("span", "badge right");
          b.append(icon("stack"), " " + t.media.length);
          wrap.append(b);
        }
        return wrap;
      }

      /* ---- Masonry columns ---- */
      let cols = [];
      let cardNodes = [];
      function colCount() {
        const w = $("#grid").clientWidth;
        return Math.max(1, Math.min(4, Math.floor((w + 14) / (240 + 14))));
      }
      function setupColumns() {
        const grid = $("#grid");
        grid.textContent = "";
        cols = [];
        for (let i = 0; i < colCount(); i++) {
          const c = el("div", "gcol");
          grid.append(c);
          cols.push(c);
        }
      }
      function placeCard(node) {
        let best = cols[0];
        for (const c of cols) if (c.offsetHeight < best.offsetHeight) best = c;
        best.append(node);
      }
      let resizeTimer = null;
      addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (!cardNodes.length || cols.length === colCount()) return;
          setupColumns();
          cardNodes.forEach(placeCard);
        }, 150);
      });

      /* ---- Cards ---- */
      function card(t) {
        const hasMedia = t.media && t.media.length > 0;
        const c = el("button", "mcard" + (hasMedia ? "" : " tcard"));
        // Look the index up at click time — deletions splice state.items.
        c.addEventListener("click", () => openLb(state.items.indexOf(t)));

        if (!hasMedia) {
          c.append(el("div", "quote", t.full_text || "(no text)"));
        } else {
          const lead = t.media.find((m) => m.file && !m.missing) || t.media[0];
          const thumb = el("div", "thumb");
          // Reserve the real aspect ratio up front so masonry placement and
          // infinite-scroll measurements are correct before the file loads.
          if (lead.width && lead.height)
            thumb.style.aspectRatio = lead.width + " / " + lead.height;
          if (lead.file && !lead.missing) {
            if (isMotion(lead)) {
              const v = document.createElement("video");
              v.src = mediaSrc(lead);
              v.muted = true;
              v.loop = true;
              v.playsInline = true;
              v.preload = "metadata";
              c.addEventListener("mouseenter", () => {
                v.play().catch(() => {});
              });
              c.addEventListener("mouseleave", () => {
                v.pause();
              });
              thumb.append(v);
            } else {
              const img = document.createElement("img");
              img.src = mediaSrc(lead);
              img.loading = "lazy";
              img.alt = "";
              thumb.append(img);
            }
          } else {
            thumb.classList.add("pending");
            thumb.append(
              (TYPE_LABELS[lead.type] || lead.type) +
                (lead.missing ? " · file missing" : " · not downloaded"),
            );
          }
          thumb.append(badgeEl(t));
          if (t.full_text) {
            const peek = el("div", "peek");
            peek.append(el("div", "ptext", t.full_text));
            thumb.append(peek);
          }
          c.append(thumb);
        }

        const meta = el("div", "meta");
        meta.append(avatarEl(t));
        meta.append(el("span", "handle", "@" + (t.screen_name || "unknown")));
        meta.append(el("span", "when", shortDate(t.created_at)));
        c.append(meta);

        return c;
      }

      /* ---- Fetch + render ---- */
      function params() {
        const p = new URLSearchParams();
        if (state.q) p.set("q", state.q);
        if (state.author) p.set("author", state.author);
        if (state.month) p.set("month", state.month);
        if (state.type !== "all") p.set("type", state.type);
        if (state.sort !== "newest") p.set("sort", state.sort);
        p.set("page", String(state.page));
        return p;
      }

      async function fetchInto(url, emptyMessage) {
        const grid = $("#grid");
        if (fetchController) fetchController.abort();
        fetchController = new AbortController();
        try {
          const res = await fetch(url, { signal: fetchController.signal });
          if (!res.ok) throw new Error("request failed");
          return await res.json();
        } catch (err) {
          if (err.name === "AbortError") return null;
          grid.classList.remove("loading");
          grid.textContent = "";
          grid.append(el("div", "empty", emptyMessage));
          $("#more").hidden = true;
          return null;
        }
      }

      function appendCards(tweets) {
        tweets.forEach((t) => {
          const node = card(t);
          cardNodes.push(node);
          placeCard(node);
        });
      }

      function updateCount() {
        $("#count").textContent =
          fmt(state.total) + (state.total === 1 ? " bookmark" : " bookmarks");
      }

      async function loadPage(append) {
        if (state.type === "missing") return loadMissing();
        resetFixAll(true);
        const grid = $("#grid");
        if (!append) grid.classList.add("loading");

        const data = await fetchInto(
          "/api/explore/tweets?" + params(),
          "Could not load bookmarks — is the local app running?",
        );
        if (!data) return;

        state.total = data.total;
        const missingCount = state.counts ? state.counts.missing : null;
        state.counts = data.counts || null;
        if (state.counts && missingCount != null)
          state.counts.missing = missingCount;
        if (!append) {
          state.items = [];
          cardNodes = [];
          setupColumns();
        }
        state.items.push(...data.items);
        appendCards(data.items);

        if (!state.items.length) {
          grid.textContent = "";
          grid.append(el("div", "empty", "No bookmarks match."));
        }
        updateCount();
        $("#more").hidden = state.items.length >= data.total;
        renderTabs();
        updateChip();
        grid.classList.remove("loading");
        // A short result may leave the sentinel still in view — keep filling.
        maybeLoadMore();
      }

      async function loadMissing() {
        const grid = $("#grid");
        grid.classList.add("loading");
        $("#more").hidden = true;
        resetFixAll(true);

        const data = await fetchInto(
          "/api/explore/missing",
          "Could not check for missing files — is the local app running?",
        );
        if (!data) return;

        state.total = data.total;
        if (!state.counts) state.counts = {};
        state.counts.missing = data.total;
        state.items = data.items;
        cardNodes = [];
        setupColumns();
        appendCards(data.items);

        if (!state.items.length) {
          grid.textContent = "";
          grid.append(
            el(
              "div",
              "empty",
              "No missing files — every downloaded media file is on disk.",
            ),
          );
        }
        updateCount();
        resetFixAll(!state.items.length);
        renderTabs();
        updateChip();
        grid.classList.remove("loading");
      }

      /* ---- Remove all missing bookmarks (two-click confirm) ---- */
      let fixArmTimer = null;
      function resetFixAll(hide) {
        const btn = $("#fixall");
        clearTimeout(fixArmTimer);
        fixArmTimer = null;
        btn.classList.remove("armed");
        btn.disabled = false;
        btn.textContent = "Remove all " + fmt(state.total);
        btn.hidden = hide;
      }
      $("#fixall").addEventListener("click", async () => {
        const btn = $("#fixall");
        if (!fixArmTimer) {
          btn.classList.add("armed");
          btn.textContent = "Click again to confirm";
          fixArmTimer = setTimeout(() => resetFixAll(false), 4000);
          return;
        }
        clearTimeout(fixArmTimer);
        fixArmTimer = null;
        btn.disabled = true;
        let res;
        try {
          res = await fetch("/api/explore/missing/fix", { method: "POST" });
        } catch {
          res = null;
        }
        if (!res || !res.ok) {
          alert("Failed to remove bookmarks — is the local app running?");
          resetFixAll(false);
          return;
        }
        if (state.counts) state.counts.missing = 0;
        resetAndLoad(); // re-fetches the Missing tab → empty state
      });

      /* ---- Infinite loading ---- */
      let loadingMore = false;
      let loadGen = 0; // bumped on every filter reset to cancel stale appends
      function sentinelNear() {
        const s = $("#more");
        return !s.hidden && s.getBoundingClientRect().top < innerHeight + 600;
      }
      async function maybeLoadMore() {
        if (loadingMore || !sentinelNear()) return;
        const gen = loadGen;
        loadingMore = true;
        state.page++;
        await loadPage(true);
        loadingMore = false;
        // Keep filling until the sentinel leaves the viewport margin;
        // a reset mid-flight owns the next fill instead.
        if (gen === loadGen) maybeLoadMore();
      }
      new IntersectionObserver(
        (entries) => {
          if (entries.some((entry) => entry.isIntersecting)) maybeLoadMore();
        },
        { rootMargin: "600px 0px" },
      ).observe($("#more"));

      // Mirror the active view and filters into the URL so views are
      // shareable and survive a reload; defaults are omitted to keep it clean.
      function syncURL() {
        const p = new URLSearchParams();
        if (state.view !== "grid") p.set("view", state.view);
        if (state.q) p.set("q", state.q);
        if (state.type !== "all") p.set("type", state.type);
        if (state.author) p.set("author", state.author);
        if (state.month) p.set("month", state.month);
        if (state.sort !== "newest") p.set("sort", state.sort);
        const qs = p.toString();
        history.replaceState(null, "", qs ? "?" + qs : location.pathname);
      }

      function resetAndLoad() {
        loadGen++;
        state.page = 1;
        syncURL();
        loadPage(false);
      }

      const monthName = (ym) => {
        const [y, mo] = ym.split("-").map(Number);
        return new Date(y, mo - 1, 1).toLocaleDateString(undefined, {
          month: "short",
          year: "numeric",
        });
      };

      function updateChip() {
        const chip = $("#chip");
        chip.hidden = !state.author;
        if (state.author) $("span", chip).textContent = "@" + state.author;
        const mchip = $("#mchip");
        mchip.hidden = !state.month;
        if (state.month) $("span", mchip).textContent = monthName(state.month);
      }

      /* ---- Subpages ---- */
      function applyView() {
        const inGrid = state.view === "grid";
        for (const sel of [".bar", ".countbar", "#grid"])
          $(sel).hidden = !inGrid;
        if (!inGrid) {
          $("#more").hidden = true;
          $("#chip").hidden = true;
          $("#mchip").hidden = true;
          $("#fixall").hidden = true;
        }
        $("#subpage").hidden = inGrid;
      }

      function setView(view) {
        state.view = view;
        syncURL();
        applyView();
        if (view === "grid") resetAndLoad();
        else renderSubpage();
      }

      // Subpage counts are archive-wide, so navigating from a subpage row
      // starts from a clean slate — lingering filters would contradict the
      // count that was just clicked.
      function clearFilters() {
        state.q = "";
        $("#q").value = "";
        state.type = "all";
        state.author = "";
        state.month = "";
      }

      // Logo / "bookmarks" stat: back to the unfiltered grid.
      function goHome() {
        clearFilters();
        state.sort = "newest";
        $("#sort").value = "newest";
        setView("grid");
      }

      const VIEW_TITLES = {
        authors: "Authors",
        media: "Media",
        timeline: "Timeline",
        activity: "Activity",
      };

      async function renderSubpage() {
        const sp = $("#subpage");
        sp.textContent = "";
        const head = el("div", "sphead");
        const back = el("button", "spback", "← Bookmarks");
        back.addEventListener("click", () => setView("grid"));
        head.append(back, el("h2", "sptitle", VIEW_TITLES[state.view] || ""));
        sp.append(head);
        const body = el("div", "spbody");
        sp.append(body);
        body.append(el("div", "spnote", "Loading…"));
        try {
          if (state.view === "authors") await renderAuthors(body);
          else if (state.view === "media") await renderMedia(body);
          else if (state.view === "timeline") await renderTimeline(body);
          else if (state.view === "activity") await renderActivity(body);
        } catch {
          body.textContent = "";
          body.append(
            el("div", "spnote", "Could not load — is the local app running?"),
          );
        }
      }

      function statRow(cls, cells, count, max, onClick) {
        const row = el("button", "srow " + cls);
        for (const cell of cells) row.append(cell);
        const track = el("span", "strack");
        const bar = el("span", "sbar");
        bar.style.width = (100 * count) / max + "%";
        track.append(bar);
        row.append(track, el("span", "scount", fmt(count)));
        row.addEventListener("click", onClick);
        return row;
      }

      let authorsCache = null;
      async function renderAuthors(body) {
        if (!authorsCache) {
          const res = await fetch("/api/explore/authors");
          if (!res.ok) throw new Error("authors request failed");
          authorsCache = (await res.json()).items;
        }
        body.textContent = "";
        if (!authorsCache.length) {
          body.append(el("div", "spnote", "No authors yet."));
          return;
        }
        const max = Math.max(1, ...authorsCache.map((a) => a.count));
        for (const a of authorsCache) {
          const who = el("span", "swho");
          who.append(el("b", "", a.name || a.screen_name));
          who.append(el("span", "shandle", "@" + a.screen_name));
          body.append(
            statRow(
              "author",
              [avatarEl({ screen_name: a.screen_name, name: a.name }), who],
              a.count,
              max,
              () => {
                clearFilters();
                state.author = a.screen_name;
                setView("grid");
              },
            ),
          );
        }
      }

      async function renderMedia(body) {
        const stats = await ensureStats();
        body.textContent = "";
        const summary =
          fmt(stats.totals.media_downloaded) +
          " of " +
          fmt(stats.totals.media_total) +
          " files downloaded" +
          (stats.totals.media_failed > 0
            ? " · " + fmt(stats.totals.media_failed) + " failed"
            : "");
        body.append(el("p", "spsummary", summary));
        const LABELS = {
          photo: ["Photos", "photo"],
          video: ["Videos", "video"],
          animated_gif: ["GIFs", "gif"],
        };
        const types = (stats.media_types || []).filter((mt) => LABELS[mt.type]);
        if (!types.length) {
          body.append(el("div", "spnote", "No media yet."));
          return;
        }
        const max = Math.max(1, ...types.map((mt) => mt.count));
        for (const mt of types) {
          const [label, tab] = LABELS[mt.type];
          body.append(
            statRow("plain", [el("span", "slabel", label)], mt.count, max, () => {
              clearFilters();
              state.type = tab;
              setView("grid");
            }),
          );
        }
      }

      /* ---- Activity: live tail of the app's log ---- */
      let logTimer = null;
      let logLastId = 0;
      function logRow(entry) {
        const row = el("div", "logrow " + entry.level);
        const marks = { info: "•", warn: "!", error: "✗" };
        row.append(
          el(
            "span",
            "ltime",
            new Date(entry.time).toLocaleTimeString(undefined, {
              hour12: false,
            }),
          ),
          el("span", "lmark", marks[entry.level] || "•"),
          el("span", "lmsg", entry.msg),
        );
        return row;
      }
      async function renderActivity(body) {
        body.classList.add("wide");
        body.textContent = "";
        const list = el("div", "loglist");
        body.append(list);
        logLastId = 0;
        clearInterval(logTimer);

        const poll = async () => {
          if (state.view !== "activity") {
            clearInterval(logTimer);
            logTimer = null;
            return;
          }
          let data;
          try {
            const res = await fetch("/api/explore/logs?after=" + logLastId);
            if (!res.ok) throw new Error();
            data = await res.json();
          } catch {
            return; // transient; try again next tick
          }
          if (!data.items.length) {
            if (!list.children.length)
              list.append(el("div", "spnote", "No activity yet."));
            return;
          }
          const note = list.querySelector(".spnote");
          if (note) note.remove();
          // Follow the tail only if the user is already at the bottom.
          const stick =
            list.scrollHeight - list.scrollTop - list.clientHeight < 40;
          for (const entry of data.items) list.append(logRow(entry));
          while (list.children.length > 500) list.firstChild.remove();
          logLastId = data.last_id;
          if (stick) list.scrollTop = list.scrollHeight;
        };
        await poll();
        list.scrollTop = list.scrollHeight;
        logTimer = setInterval(poll, 2000);
      }

      async function renderTimeline(body) {
        const stats = await ensureStats();
        body.textContent = "";
        const monthly = (stats.monthly || [])
          .filter((m) => m.count > 0) // gap months add noise, not information
          .reverse(); // newest first
        if (!monthly.length) {
          body.append(el("div", "spnote", "No bookmarks yet."));
          return;
        }
        const max = Math.max(1, ...monthly.map((m) => m.count));
        for (const m of monthly) {
          body.append(
            statRow(
              "plain",
              [el("span", "slabel", monthName(m.month))],
              m.count,
              max,
              () => {
                clearFilters();
                state.month = m.month;
                setView("grid");
              },
            ),
          );
        }
      }

      /* ---- Lightbox ---- */
      let lbIndex = 0;
      function openLb(i) {
        lbIndex = i;
        fillLb();
        $("#lb").classList.add("open");
        document.body.style.overflow = "hidden";
      }
      function closeLb() {
        $("#lb").classList.remove("open");
        document.body.style.overflow = "";
        $("#lbmedia").textContent = ""; // stop any playing video
      }
      /* ---- Linkify URLs, @mentions, and #hashtags in tweet text ---- */
      const LINKIFY_RE =
        /(https?:\/\/[^\s]+)|((?<![\w@])@[A-Za-z0-9_]{1,15})|((?<![\w#])#[\p{L}\p{N}_]+)/gu;
      function linkify(text) {
        const frag = document.createDocumentFragment();
        let last = 0;
        for (const m of text.matchAll(LINKIFY_RE)) {
          let s = m[0];
          if (m[1]) {
            // Trailing punctuation belongs to the sentence, not the URL.
            const trimmed = s.replace(/[.,;:!?)'"\]]+$/, "");
            s = trimmed || s;
          }
          if (m.index > last) frag.append(text.slice(last, m.index));
          const a = document.createElement("a");
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = s;
          if (m[1]) a.href = s;
          else if (m[2]) a.href = "https://x.com/" + s.slice(1);
          else a.href = "https://x.com/hashtag/" + encodeURIComponent(s.slice(1));
          frag.append(a);
          last = m.index + s.length;
        }
        if (last < text.length) frag.append(text.slice(last));
        return frag;
      }

      function fillLb() {
        const t = state.items[lbIndex];
        if (!t) return;
        const m = $("#lbmedia");
        m.textContent = "";
        const media = t.media || [];
        let firstVideo = null;
        if (!media.length) {
          const quote = el("div", "lb-quote");
          quote.append(linkify(t.full_text || "(no text)"));
          m.append(quote);
        } else {
          for (const item of media) {
            if (!item.file || item.missing) {
              m.append(
                el(
                  "div",
                  "pending",
                  (TYPE_LABELS[item.type] || item.type) +
                    (item.missing ? " · file missing" : " · not downloaded"),
                ),
              );
              continue;
            }
            if (isMotion(item)) {
              const v = document.createElement("video");
              v.src = mediaSrc(item);
              v.preload = "metadata";
              v.playsInline = true;
              if (item.type === "animated_gif") {
                v.muted = true;
                v.loop = true;
                v.autoplay = true;
              } else {
                v.controls = true;
                if (!firstVideo) firstVideo = v;
              }
              m.append(v);
            } else {
              const img = document.createElement("img");
              img.src = mediaSrc(item);
              img.alt = "";
              m.append(img);
            }
          }
        }
        // Opening/navigating is a user gesture, so play-with-sound is allowed;
        // if the browser still blocks it, retry muted.
        if (firstVideo) {
          firstVideo.play().catch(() => {
            firstVideo.muted = true;
            firstVideo.play().catch(() => {});
          });
        }
        const av = avatarEl(t);
        av.id = "lbavatar";
        $("#lbavatar").replaceWith(av);
        $("#lbname").textContent = t.name || t.screen_name || "unknown";
        $("#lbhandle").textContent = "@" + (t.screen_name || "unknown");
        $("#lbfilter").hidden = !t.screen_name;
        if (t.screen_name)
          $("#lbfilter").textContent = "More from @" + t.screen_name;
        const lbtext = $("#lbtext");
        lbtext.textContent = "";
        lbtext.append(linkify(t.full_text || ""));
        $("#lbdate").textContent = fmtDate(t.created_at) + " ↗";
        $("#lbdate").href = t.permanent_url || "#";
        $("#lbreveal").hidden = !(t.media || []).some(
          (item) => item.file && !item.missing,
        );
        hideConfirm();
        $("#lbprev").disabled = lbIndex <= 0;
        $("#lbnext").disabled = lbIndex >= state.items.length - 1;
      }
      $("#lbclose").addEventListener("click", closeLb);
      $("#lb").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeLb();
      });
      $("#lbprev").addEventListener("click", () => {
        if (lbIndex > 0) {
          lbIndex--;
          fillLb();
        }
      });
      $("#lbnext").addEventListener("click", () => {
        if (lbIndex < state.items.length - 1) {
          lbIndex++;
          fillLb();
        }
      });
      addEventListener("keydown", (e) => {
        if (!$("#lb").classList.contains("open")) return;
        if (e.key === "Escape") closeLb();
        if (e.key === "ArrowLeft") $("#lbprev").click();
        if (e.key === "ArrowRight") $("#lbnext").click();
      });
      function filterAuthor(handle) {
        state.author = handle;
        closeLb();
        resetAndLoad();
        scrollTo({ top: 0, behavior: "smooth" });
      }
      for (const sel of ["#lbname", "#lbhandle"]) {
        $(sel).addEventListener("click", () => {
          const t = state.items[lbIndex];
          if (t && t.screen_name) filterAuthor(t.screen_name);
        });
      }
      $("#lbfilter").addEventListener("click", () => {
        const t = state.items[lbIndex];
        if (t && t.screen_name) filterAuthor(t.screen_name);
      });

      /* ---- Remove bookmark (optionally with its files) ---- */
      function decrementCounts(t) {
        const c = state.counts;
        if (!c) return;
        const dec = (key) => {
          if (c[key] != null && c[key] > 0) c[key]--;
        };
        dec("all");
        const kinds = new Set((t.media || []).map((m) => m.type));
        if (!kinds.size) dec("text");
        if (kinds.has("photo")) dec("photo");
        if (kinds.has("video")) dec("video");
        if (kinds.has("animated_gif")) dec("gif");
        if ((t.media || []).some((m) => m.missing)) dec("missing");
      }
      function showConfirm() {
        const t = state.items[lbIndex];
        if (!t) return;
        const hasFiles = (t.media || []).some(
          (item) => item.file && !item.missing,
        );
        $("#lbdelfiles").hidden = !hasFiles;
        $("#lbkeep").textContent = hasFiles ? "Just the bookmark" : "Remove";
        $("#lbactions").hidden = true;
        $("#lbconfirm").hidden = false;
      }
      function hideConfirm() {
        $("#lbconfirm").hidden = true;
        $("#lbactions").hidden = false;
      }
      async function removeTweet(deleteFiles) {
        const t = state.items[lbIndex];
        if (!t) return;
        let res;
        try {
          res = await fetch("/api/explore/tweets/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: t.id, delete_files: deleteFiles }),
          });
        } catch {
          res = null;
        }
        if (!res || !res.ok) {
          alert("Failed to remove the bookmark — is the local app running?");
          return;
        }
        // Remove the card in place: no refetch, no masonry reflow.
        const node = cardNodes[lbIndex];
        if (node) node.remove();
        state.items.splice(lbIndex, 1);
        cardNodes.splice(lbIndex, 1);
        state.total = Math.max(0, state.total - 1);
        decrementCounts(t);
        updateCount();
        if (state.type === "missing") resetFixAll(!state.items.length);
        renderTabs();
        closeLb();
      }
      $("#lbreveal").addEventListener("click", async () => {
        const t = state.items[lbIndex];
        const item = ((t && t.media) || []).find((m) => m.file && !m.missing);
        if (!item) return;
        let res;
        try {
          res = await fetch("/api/explore/reveal", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file: item.file }),
          });
        } catch {
          res = null;
        }
        if (!res || !res.ok)
          alert("Could not reveal the file — is the local app running?");
      });
      $("#lbremove").addEventListener("click", showConfirm);
      $("#lbcancel").addEventListener("click", hideConfirm);
      $("#lbkeep").addEventListener("click", () => removeTweet(false));
      $("#lbdelfiles").addEventListener("click", () => removeTweet(true));

      /* ---- Download progress strip ---- */
      const fmtBytes = (n) => {
        if (n < 1024) return n + " B";
        const units = ["KB", "MB", "GB"];
        let u = -1;
        do {
          n /= 1024;
          u++;
        } while (n >= 1024 && u < units.length - 1);
        return n.toFixed(1) + " " + units[u];
      };
      let dlWasBusy = false;
      let dlTimer = null;
      async function pollDownloads() {
        let data = null;
        try {
          const res = await fetch("/api/explore/downloads");
          if (res.ok) data = await res.json();
        } catch {
          data = null;
        }
        const busy =
          !!data && (data.pending > 0 || (data.active || []).length > 0);
        $("#dlstrip").hidden = !busy;
        if (busy) {
          const target = data.downloaded + data.pending;
          const pct = target
            ? Math.floor((100 * data.downloaded) / target)
            : 0;
          $("#dltext").textContent =
            "Downloading media — " +
            fmt(data.downloaded) +
            " of " +
            fmt(target) +
            (data.failed > 0 ? " · " + fmt(data.failed) + " failed" : "");
          $("#dlpct").textContent = pct + "%";
          $("#dlbar").style.width = pct + "%";
          const files = $("#dlfiles");
          files.textContent = "";
          for (const f of data.active || []) {
            const row = el("div", "dlfile");
            row.append(el("span", "fname", f.file));
            const track = el("span", "ftrack");
            const bar = el("span", "fbar");
            const fp = f.total > 0 ? Math.floor((100 * f.written) / f.total) : 0;
            bar.style.width = (f.total > 0 ? fp : 100) + "%";
            track.append(bar);
            row.append(track);
            row.append(
              el("span", "fpct", f.total > 0 ? fp + "%" : fmtBytes(f.written)),
            );
            files.append(row);
          }
        } else if (dlWasBusy) {
          // Queue just drained — refresh the header stats.
          statsCache = null;
          loadStats().catch(() => {});
        }
        dlWasBusy = busy;
        clearTimeout(dlTimer);
        dlTimer = setTimeout(pollDownloads, busy ? 2000 : 15000);
      }

      /* ---- Controls ---- */
      $("#home").addEventListener("click", goHome);
      let debounceTimer = null;
      $("#q").addEventListener("input", (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          state.q = e.target.value.trim();
          resetAndLoad();
        }, 300);
      });
      $("#sort").addEventListener("change", (e) => {
        state.sort = e.target.value;
        resetAndLoad();
      });
      $("#chip button").addEventListener("click", () => {
        state.author = "";
        resetAndLoad();
      });
      $("#mchip button").addEventListener("click", () => {
        state.month = "";
        resetAndLoad();
      });

      /* ---- Boot ---- */
      (function initFromURL() {
        const p = new URLSearchParams(location.search);
        const view = p.get("view");
        if (["authors", "media", "timeline", "activity"].includes(view))
          state.view = view;
        state.q = (p.get("q") || "").trim();
        const type = p.get("type") || "all";
        if (KIND_TABS.some(([key]) => key === type)) state.type = type;
        state.author = (p.get("author") || "").trim();
        if (/^\d{4}-\d{2}$/.test(p.get("month") || ""))
          state.month = p.get("month");
        const sort = p.get("sort");
        if (["oldest", "tweet-newest", "tweet-oldest"].includes(sort))
          state.sort = sort;
        $("#q").value = state.q;
        $("#sort").value = state.sort;
      })();
      renderTabs();
      loadStats().catch(() => {
        $("#statline").textContent =
          "Could not load stats — is the local app running?";
      });
      applyView();
      if (state.view === "grid") resetAndLoad();
      else renderSubpage();
      pollDownloads();
    </script>
  </body>
</html>
