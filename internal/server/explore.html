<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>TBD Explorer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%94%96%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/explore.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No theme-color meta on purpose: standalone iOS paints the status bar
         with it, opaque, which defeats black-translucent below. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TBD" />
  </head>
  <body>
    <main>
      <header class="page">
        <div class="brandrow">
          <h1>
            <button id="home" title="Show all bookmarks">TBD Explorer</button>
          </h1>
          <span class="acct" id="acctwrap" hidden>
            <select id="acct" aria-label="Account being viewed"></select>
            <span class="probe" id="acctprobe" aria-hidden="true"></span>
          </span>
        </div>
        <div class="headright">
          <!-- Filled in only when setup needs attention, or stats fail to load. -->
          <div class="statline" id="statline"></div>
          <details class="menu" id="menu">
            <summary id="menubtn">Menu</summary>
            <div class="menupop" id="menupop"></div>
          </details>
        </div>
      </header>

      <div id="dlstrip" hidden>
        <div class="dlhead">
          <span id="dltext"></span>
          <span id="dlpct"></span>
        </div>
        <div class="dltrack"><div class="dlbar" id="dlbar"></div></div>
        <div id="dlfiles"></div>
      </div>

      <div class="bar">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <input
            id="q"
            type="search"
            placeholder="Search text, name, or @handle"
            aria-label="Search bookmarks"
          />
        </div>
        <div class="barrow">
          <div
            class="tabs"
            role="group"
            aria-label="Filter by media type"
            id="tabs"
          ></div>
          <span class="selwrap">
            <select id="sort" aria-label="Sort order">
              <option value="newest">Recently added</option>
              <option value="oldest">Oldest added</option>
              <option value="tweet-newest">Newest tweets</option>
              <option value="tweet-oldest">Oldest tweets</option>
              <option value="longest">Longest video</option>
              <option value="shortest">Shortest video</option>
            </select>
          </span>
        </div>
      </div>

      <span id="chip" class="chip" hidden>
        <span></span
        ><button title="Clear author filter" aria-label="Clear author filter">
          ×
        </button>
      </span>
      <span id="mchip" class="chip" hidden>
        <span></span
        ><button title="Clear month filter" aria-label="Clear month filter">
          ×
        </button>
      </span>

      <div class="countbar">
        <div id="count"></div>
        <button class="fixall" id="fixall" hidden>Remove all</button>
      </div>
      <div id="grid"></div>
      <div class="sentinel" id="more" hidden aria-hidden="true">
        Loading more…
      </div>
      <section id="subpage" hidden></section>
    </main>

    <div id="lb" role="dialog" aria-modal="true" aria-label="Bookmark detail">
      <button class="lb-close" id="lbclose" aria-label="Close">✕</button>
      <button class="lb-nav prev" id="lbprev" aria-label="Previous">←</button>
      <button class="lb-nav next" id="lbnext" aria-label="Next">→</button>
      <div class="lb-panel">
        <div class="lb-media" id="lbmedia"></div>
        <div class="lb-feed" id="lbfeed" hidden></div>
        <div class="lb-jump" id="lbjump" aria-hidden="true"></div>
        <div class="lb-pause" aria-hidden="true">▶</div>
        <div class="lb-bar" id="lbbar" aria-hidden="true">
          <span id="lbbarfill"></span>
        </div>
        <div class="lb-side">
          <div class="lb-progress" id="lbctl">
            <button id="lbplay" type="button" aria-label="Pause">❚❚</button>
            <span class="lbtime" id="lbat">0:00</span>
            <div class="lbtrack" id="lbseek">
              <span class="lbrail"><span class="lbfill" id="lbfill"></span></span>
            </div>
            <span class="lbtime" id="lbdur">0:00</span>
            <button id="lbmute" type="button" aria-label="Mute">
              <svg viewBox="0 0 12 12" aria-hidden="true">
                <path d="M1.2 4.2h2.2l3.2-2.6v8.8L3.4 7.8H1.2Z" />
                <path class="wave" d="M8.4 3.7a3.1 3.1 0 0 1 0 4.6" />
                <path class="slash" d="m8.2 4.4 3 3.2m0-3.2-3 3.2" />
              </svg>
            </button>
          </div>
          <div class="lb-author">
            <span class="avatar" id="lbavatar"></span>
            <span class="who">
              <b id="lbname" title="Filter by this author"></b>
              <span id="lbhandle" title="Filter by this author"></span>
            </span>
          </div>
          <p class="lb-text" id="lbtext"></p>
          <a
            class="lb-date"
            id="lbdate"
            href="#"
            target="_blank"
            rel="noopener"
            title="Open on X"
          ></a>
          <div class="lb-actions" id="lbactions">
            <button id="lbfilter">More from this author</button>
            <button id="lbreveal" hidden>Reveal in Finder</button>
            <button
              class="iconbtn"
              id="lbremove"
              title="Remove bookmark"
              aria-label="Remove bookmark"
            >
              <svg
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path
                  d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.7 9.2a1 1 0 0 0 1 .8h4.6a1 1 0 0 0 1-.8L12 4M6.5 7v4M9.5 7v4"
                ></path>
              </svg>
            </button>
          </div>
          <div class="lb-actions lb-confirm" id="lbconfirm" hidden>
            <div class="crow chead">
              <span class="cq">Remove this bookmark?</span>
              <button class="quiet" id="lbcancel">Cancel</button>
            </div>
            <div class="crow">
              <button id="lbkeep">Just the bookmark</button>
              <button class="danger" id="lbdelfiles">Also delete files</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/explore.js"></script>
  </body>
</html>
